<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校務系統 | 學生 · 教師 · 管理員</title>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b;
  --primary:#2563eb; --primary-d:#1d4ed8; --green:#16a34a; --red:#dc2626;
  --amber:#d97706; --border:#e2e8f0; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--primary)}
/* ===== 登入頁 ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#06b6d4)}
.login-card{width:100%;max-width:960px;background:#fff;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 1.1fr;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.login-left{background:linear-gradient(160deg,#172554,#1e40af);color:#fff;padding:40px 36px;display:flex;flex-direction:column;justify-content:center}
.login-left h1{margin:0 0 8px;font-size:32px}
.login-left p{opacity:.85;line-height:1.7}
.feat{margin-top:20px;display:grid;gap:10px;font-size:14px}
.feat div{background:rgba(255,255,255,.12);padding:10px 12px;border-radius:10px}
.login-right{padding:36px 34px}
.tabs{display:flex;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:700;color:var(--muted)}
.tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:15px;font-family:inherit}
textarea{resize:vertical;min-height:90px}
.btn{border:0;border-radius:9px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer}
.btn-p{background:var(--primary);color:#fff;width:100%;margin-top:16px;padding:12px}
.btn-p:hover{background:var(--primary-d)}
.btn-g{background:#eef2ff;color:var(--primary)}
.btn-danger{background:#fee2e2;color:var(--red)}
.btn-ok{background:#dcfce7;color:#15803d}
.btn-sm{padding:6px 10px;font-size:13px;width:auto;margin:0}
.demo{margin-top:16px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;font-size:13px}
.demo button{margin:4px 4px 0 0}
/* ===== 主介面 ===== */
#app{display:none;min-height:100vh}
.topbar{background:#0f172a;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar .logo{font-weight:900;font-size:18px}
.badge{background:#334155;padding:3px 10px;border-radius:99px;font-size:12px}
.topbar .sp{flex:1}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 53px)}
.side{background:#fff;border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:6px}
.side button.nav{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;font-size:15px;cursor:pointer;color:#334155;font-weight:600}
.side button.nav:hover{background:#f1f5f9}
.side button.nav.active{background:#dbeafe;color:var(--primary-d)}
.main{padding:22px;max-width:1150px;width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{margin:0 0 4px;font-size:20px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
th,td{border-bottom:1px solid var(--border);padding:9px 8px;text-align:left;vertical-align:middle}
th{background:#f8fafc;color:#475569;font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.p-green{background:#dcfce7;color:#15803d}.p-red{background:#fee2e2;color:#b91c1c}
.p-blue{background:#dbeafe;color:#1d4ed8}.p-amber{background:#fef3c7;color:#b45309}.p-gray{background:#f1f5f9;color:#475569}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.toolbar input,.toolbar select{width:auto}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.kpi .k{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:140px}
.kpi .k b{font-size:22px;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.modal h3{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 課表 */
.tt{display:grid;grid-template-columns:70px repeat(5,1fr);gap:6px;margin-top:10px}
.tt .h{background:#0f172a;color:#fff;border-radius:8px;padding:8px;text-align:center;font-weight:800;font-size:13px}
.tt .t{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:6px;font-size:12px;text-align:center;color:var(--muted)}
.tt .c{background:#dbeafe;border:1px solid #bfdbfe;border-radius:8px;padding:6px;font-size:12.5px;line-height:1.5}
.tt .c b{display:block;font-size:13px}
.empty{background:#fff;border:1px dashed var(--border);border-radius:8px;min-height:44px}
.ann{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ann h4{margin:0 0 4px;font-size:16px}
.ann .meta{font-size:12.5px;color:var(--muted);margin-bottom:6px}
@media(max-width:900px){.login-card{grid-template-columns:1fr}.login-left{display:none}.layout{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto}.grid2,.grid3,.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ============ 登入 ============ -->
<div id="loginPage" class="login-wrap">
  <div class="login-card">
    <div class="login-left">
      <h1 style="text-align:center">校務系統</h1>
    </div>
    <div class="login-right">
      <h2 style="margin:0">登入</h2>
      <p class="sub">請選擇身分並輸入帳號密碼</p>
      <div class="tabs" id="roleTabs">
        <button data-role="student" class="active">學生</button>
        <button data-role="teacher">老師</button>
        <button data-role="admin">管理員</button>
      </div>
      <label>帳號</label><input id="loginAcc" placeholder="例如 s001">
      <label>密碼</label><input id="loginPw" type="password" placeholder="預設 123456，管理員 admin123">
      <button class="btn btn-p" onclick="doLogin()">登入</button>
      <div class="demo" id="demoBox"></div>
    </div>
  </div>
</div>

<!-- ============ 主程式 ============ -->
<div id="app">
  <div class="topbar">
    <span class="logo">🎓 校務系統</span>
    <span class="badge" id="roleBadge"></span>
    <span id="userInfo" style="font-size:14px;opacity:.9"></span>
    <span class="sp"></span>
    <button class="btn btn-sm btn-g" onclick="resetDB()">↺ 還原展示資料</button>
    <button class="btn btn-sm btn-danger" onclick="logout()">登出</button>
  </div>
  <div class="layout">
    <div class="side" id="sideNav"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const userById = id => DB.users.find(u=>u.id===id);
const courseById = id => DB.courses.find(c=>c.id===id);
const enrolledCount = cid => DB.enrollments.filter(e=>e.courseId===cid).length;
const myEnrollments = sid => DB.enrollments.filter(e=>e.studentId===sid);
const gradeOf = (sid,cid) => DB.grades.find(g=>g.studentId===sid&&g.courseId===cid);
/* 成績權重: 平時30% 期中30% 期末40% */
const GRADE_W={regular:0.3,midterm:0.3,final:0.4};
function calcSem(r,m,f){ if(r==null||m==null||f==null||r===""||m===""||f==="") return null;
  r=+r;m=+m;f=+f; if([r,m,f].some(v=>isNaN(v)||v<0||v>100)) return null; return Math.round(r*0.3+m*0.3+f*0.4); }
function scoreCell(v){ return v==null?'<span class="pill p-gray">—</span>':v; }
/* 課程排名(依學期成績) */
function rankOf(sid,cid){
  const rows=DB.enrollments.filter(e=>e.courseId===cid)
    .map(e=>({sid:e.studentId,s:(gradeOf(e.studentId,cid)||{}).score}))
    .filter(x=>x.s!=null).sort((a,b)=>b.s-a.s);
  const i=rows.findIndex(x=>x.sid===sid);
  return i<0?null:{rank:i+1,total:rows.length};
}
/* 操行: 基點85; 嘉獎+1 小功+2.5 大功+7.5 警告-1 小過-2.5 大過-7.5 */
const CONDUCT_BASE=85;
const CONDUCT_PT={"嘉獎":1,"小功":2.5,"大功":7.5,"警告":-1,"小過":-2.5,"大過":-7.5};
const REWARD_TYPES=["嘉獎","小功","大功","警告","小過","大過"];
function conductOf(sid){
  const list=DB.rewards.filter(r=>r.studentId===sid).sort((a,b)=>b.date.localeCompare(a.date));
  let s=CONDUCT_BASE; list.forEach(r=>{ s+=CONDUCT_PT[r.type]||0; });
  s=Math.max(0,Math.min(100,Math.round(s*10)/10));
  return {score:s,list};
}
function leavePill(st){ return st==="通過"?'<span class="pill p-green">通過</span>':st==="退回"?'<span class="pill p-red">退回</span>':'<span class="pill p-amber">待審核</span>'; }
function myAdvisees(tid){ return DB.users.filter(u=>u.role==="student"&&u.advisorId===tid); }
function gpa(list){ // list of scores
  if(!list.length) return "—";
  const pts = list.map(s=> s>=90?4.3: s>=85?4.0: s>=80?3.7: s>=77?3.3: s>=73?3.0: s>=70?2.7: s>=67?2.3: s>=63?2.0: s>=60?1.7:0);
  return (pts.reduce((a,b)=>a+b,0)/pts.length).toFixed(2);
}
function gradePill(s){
  if(s==null) return `<span class="pill p-gray">未公布</span>`;
  const c = s>=90?"p-green":s>=80?"p-blue":s>=60?"p-amber":"p-red";
  return `<span class="pill ${c}">${s} 分</span>`;
}
function statusPill(s){
  const m={"出席":"p-green","遲到":"p-amber","缺席":"p-red","請假":"p-blue"};
  return `<span class="pill ${m[s]||"p-gray"}">${esc(s)}</span>`;
}

function renderCourseRows(){

  let list=DB.courses.filter(c=>c.semester===CURR_SEM);

      :full?`<span class="pill p-red">已滿</span>`:`<button class="btn btn-sm btn-ok" onclick="addCourse('${c.id}')">加選</button>`;
    return `<tr><td>${esc(c.code)}</td><td><b>${esc(c.name)}</b><br><span style="font-size:12px;color:#64748b">${esc(c.desc||"")}</span></td>

function addCourse(cid){
  const c=courseById(cid);
  if(myEnrollments(session.id).some(e=>e.courseId===cid)) return alert("已選過此課程");
  if(enrolledCount(cid)>=c.capacity) return alert("名額已滿");
  const cred=DB.courses.filter(x=>x.semester===CURR_SEM&&myEnrollments(session.id).some(e=>e.courseId===x.id)).reduce((a,x)=>a+x.credits,0);
  if(cred+c.credits>25) return alert("超過學分上限 25 學分");
  const mine=DB.courses.filter(x=>myEnrollments(session.id).some(e=>e.courseId===x.id)&&x.semester===CURR_SEM);
  if(mine.some(m=>m.time===c.time)) if(!confirm(`與「${mine.find(m=>m.time===c.time).name}」同時間，仍要加選？`)) return;
  DB.enrollments.push({studentId:session.id,courseId:cid}); saveDB(); render(); alert(`已加選 ${c.name}`);
}

const WEEK=["週一","週二","週三","週四","週五"];
function parseTime(t){ const m=String(t).match(/(週[一二三四五])\s*(\d+):(\d+)-(\d+):(\d+)/); if(!m) return null;
  return {wd:m[1],s:+m[2]+(+m[3])/60,e:+m[4]+(+m[5])/60}; }
function vTimetable(){
  const mine=DB.courses.filter(c=>c.semester===CURR_SEM&&myEnrollments(session.id).some(e=>e.courseId===c.id));
  const slots=["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00"];
  let cells="";
  slots.forEach(s=>{
    const h=+s.split(":")[0];
    cells+=`<div class="t">${s}</div>`;
    WEEK.forEach(w=>{
      const hit=mine.filter(c=>{const p=parseTime(c.time);return p&&p.wd===w&&h>=Math.floor(p.s)&&h<p.e;});
      cells+=hit.length?`<div class="c"><b>${esc(hit[0].name)}</b>${esc(hit[0].room)}<br>${esc(hit[0].time)}</div>`:`<div class="empty"></div>`;
    });
  });
  return `<div class="card"><h2>🗓️ 我的課表（${CURR_SEM}）</h2><div class="sub">共 ${mine.length} 門課</div>
  <div class="tt"><div class="h">時間</div>${WEEK.map(w=>`<div class="h">${w}</div>`).join("")}${cells}</div></div>
  <div class="card"><h2>修課明細</h2><table><tr><th>課程</th><th>老師</th><th>時間</th><th>教室</th><th>學分</th></tr>
  ${mine.map(c=>`<tr><td>${esc(c.code)} ${esc(c.name)}</td><td>${esc(userById(c.teacherId)?.name)}</td><td>${esc(c.time)}</td><td>${esc(c.room)}</td><td>${c.credits}</td></tr>`).join("")}</table></div>`;
}

/* ---------- 學生：成績 ---------- */
function vGrade(hist){
  if(!hist){
    const en=myEnrollments(session.id).map(e=>courseById(e.courseId)).filter(c=>c&&c.semester===CURR_SEM);
    const scores=en.map(c=>gradeOf(session.id,c.id)?.score).filter(s=>s!=null);
    return `<div class="card"><h2>📝 成績查詢（本學期 ${CURR_SEM}）</h2>
    <div class="kpi"><div class="k">平均 <b>${scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):"—"}</b></div>
    <div class="k">GPA <b>${gpa(scores)}</b></div><div class="k">已公布 <b>${scores.length}/${en.length}</b></div></div>
    <div class="sub">學期成績 = 平時×30% + 期中×30% + 期末×40%（四捨五入）・排名依學期成績計算</div>
    <table><tr><th>課程</th><th>平時(30%)</th><th>期中(30%)</th><th>期末(40%)</th><th>學期成績</th><th>排名</th></tr>
    ${en.map(c=>{const g=gradeOf(session.id,c.id);const r=rankOf(session.id,c.id);
      return `<tr><td>${esc(c.code)} ${esc(c.name)}<br><span style="font-size:12px;color:#64748b">${esc(userById(c.teacherId)?.name)}・${c.credits}學分</span></td>
      <td>${scoreCell(g?.regular)}</td><td>${scoreCell(g?.midterm)}</td><td>${scoreCell(g?.final)}</td>
      <td>${gradePill(g?.score)}</td><td>${r?`第 <b>${r.rank}</b> / ${r.total} 名`:'<span class="pill p-gray">未公布</span>'}</td></tr>`}).join("")||"<tr><td colspan=6>尚未選課</td></tr>"}</table></div>`;
  }
  // 歷年
  const all=myEnrollments(session.id).map(e=>courseById(e.courseId)).filter(Boolean);
  const sems=[...new Set(all.map(c=>c.semester))].sort();
  const allScores=all.map(c=>gradeOf(session.id,c.id)?.score).filter(s=>s!=null);
  return `<div class="card"><h2>📚 歷年成績查詢</h2>
  <div class="kpi"><div class="k">累計修課 <b>${all.length}</b></div><div class="k">累計 GPA <b>${gpa(allScores)}</b></div>
  <div class="k">累計學分 <b>${all.filter(c=>{const g=gradeOf(session.id,c.id);return g&&g.score>=60;}).reduce((a,c)=>a+c.credits,0)}</b></div></div>

        return `<tr><td>${esc(s.account)}</td><td>${esc(s.name)}</td><td>${esc(s.dept)}</td><td>${gradePill(g?.score)}</td><td>${ab}</td><td><button class="btn btn-sm btn-g" onclick="viewStudent('${s.id}')">查看</button></td></tr>`}).join("")||"<tr><td colspan=6>尚無學生選修</td></tr>"}</table>`;

      ${studs.map(s=>{const g=(gradeOf(s.id,c.id)||{});return `<tr><td>${esc(s.account)}</td><td>${esc(s.name)}</td>
        <td><input id="gr_${s.id}" type="number" min="0" max="100" value="${g.regular??""}" style="width:75px" oninput="previewSem('${s.id}')"></td>
        <td><input id="gm_${s.id}" type="number" min="0" max="100" value="${g.midterm??""}" style="width:75px" oninput="previewSem('${s.id}')"></td>
        <td><input id="gf_${s.id}" type="number" min="0" max="100" value="${g.final??""}" style="width:75px" oninput="previewSem('${s.id}')"></td>
        <td id="gs_${s.id}">${g.score??"—"}</td>
        <td><button class="btn btn-sm btn-ok" onclick="saveGrade('${c.id}','${s.id}')">儲存</button></td></tr>`}).join("")}</table>
      <div class="toolbar"><button class="btn btn-sm btn-g" onclick="publishAll('${c.id}')">未填者一鍵帶入 80 分</button></div>`;
    if(teacherTab==="att") body=teacherAttBody(c, studs);
    detail=`<div class="card"><h2>📖 ${esc(c.code)} ${esc(c.name)}</h2>

}
function pickCourse(id){ curTeacherCourse=id; teacherTab="students"; render(); }
function setTTab(t){ teacherTab=t; render(); }
function previewSem(sid){
  const s=calcSem($("gr_"+sid).value,$("gm_"+sid).value,$("gf_"+sid).value);
  $("gs_"+sid).textContent = s==null?"—":s+"（自動）";
}
function saveGrade(cid,sid){
  const rv=$("gr_"+sid).value, mv=$("gm_"+sid).value, fv=$("gf_"+sid).value;
  const hasAny = rv!==""||mv!==""||fv!=="";
  const r=rv===""?null:+rv, m=mv===""?null:+mv, f=fv===""?null:+fv;
  if([r,m,f].some(v=>v!=null&&(isNaN(v)||v<0||v>100))) return alert("分數需為 0–100，留空代表未公布");
  if(hasAny&&(r==null||m==null||f==null)) return alert("平時、期中、期末需一次填齊才能換算學期成績（或全部留空清除）");
  DB.grades=DB.grades.filter(g=>!(g.studentId===sid&&g.courseId===cid));
  if(hasAny) DB.grades.push({studentId:sid,courseId:cid,regular:r,midterm:m,final:f,score:calcSem(r,m,f)});
  saveDB(); render(); alert("已儲存");
}
function publishAll(cid){
  DB.enrollments.filter(e=>e.courseId===cid).forEach(e=>{
    if(!gradeOf(e.studentId,cid)) DB.grades.push({studentId:e.studentId,courseId:cid,regular:80,midterm:80,final:80,score:80});
  }); saveDB(); render();
}
function teacherAttBody(c, studs){
  const recs=DB.attendance.filter(a=>a.courseId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="grid2"><div>
    <h4>＋ 新增點名紀錄</h4>
    <label>日期</label><input type="date" id="ad" value="${new Date().toISOString().slice(0,10)}">
    ${studs.map(s=>`<div style="display:flex;gap:6px;align-items:center;margin:6px 0"><span style="flex:1">${esc(s.name)}(${esc(s.account)})</span>
      <select id="a_${s.id}" style="width:110px"><option>出席</option><option>遲到</option><option>缺席</option><option>請假</option></select></div>`).join("")||"尚無學生"}
    <label>備註</label><input id="an" placeholder="選填">
    <button class="btn btn-p btn-sm" style="width:auto;margin-top:8px" onclick="saveAtt('${c.id}')">儲存點名</button></div>
    <div><h4>歷史紀錄（${recs.length}）</h4>
    <table><tr><th>日期</th><th>學生</th><th>狀態</th><th>操作</th></tr>
    ${recs.slice(0,30).map(r=>{const s=userById(r.studentId);return `<tr><td>${esc(r.date)}</td><td>${esc(s?.name||"")}</td><td>${statusPill(r.status)}</td><td><button class="btn btn-sm btn-danger" onclick="delAtt('${r.id}')">刪</button></td></tr>`}).join("")||"<tr><td colspan=4>無</td></tr>"}</table></div></div>`;
}
function saveAtt(cid){
  const d=$("ad").value||new Date().toISOString().slice(0,10); const note=$("an").value||"";
  const studs=DB.enrollments.filter(e=>e.courseId===cid);
  studs.forEach(e=>{ const st=($("a_"+e.studentId)||{}).value||"出席";
    DB.attendance.push({id:"A"+Date.now()+e.studentId,studentId:e.studentId,courseId:cid,date:d,status:st,note}); });
  saveDB(); render(); alert(`已儲存 ${studs.length} 筆點名`);
}
function delAtt(id){ if(confirm("刪除此筆？")){ DB.attendance=DB.attendance.filter(a=>a.id!==id); saveDB(); render(); } }

/* ---------- 學生：請假申請 ---------- */
function vLeaveStudent(){
  const mine=DB.leaves.filter(l=>l.studentId===session.id).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card"><h2>📝 請假申請</h2>
  <div class="sub">送出後由導師審核。審核通過時，當天所有已選課程會自動記為「請假」，老師端不需再操作。</div>
  <div class="grid2"><div>
    <h4 style="margin:0 0 4px">＋ 新增請假申請</h4>
    <label>請假日期</label><input type="date" id="lv_d">
    <label>事由</label><textarea id="lv_r" placeholder="例如：感冒就醫"></textarea>
    <button class="btn btn-p btn-sm" style="width:auto;margin-top:8px" onclick="leaveApply()">送出申請</button></div>
    <div><h4 style="margin:0 0 4px">我的申請（${mine.length}）</h4>
    <table><tr><th>日期</th><th>事由</th><th>狀態</th><th>審核意見</th><th>操作</th></tr>
    ${mine.map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.reason)}</td><td>${leavePill(l.status)}</td>
      <td>${l.reviewer?esc(l.reviewer+": "+(l.reviewNote||"")):"—"}</td>
      <td>${l.status==="待審核"?`<button class="btn btn-sm btn-danger" onclick="leaveCancel('${l.id}')">撤回</button>`:"—"}</td></tr>`).join("")||"<tr><td colspan=5>尚無申請</td></tr>"}</table></div></div></div>`;
}
function leaveApply(){
  const d=$("lv_d").value, r=$("lv_r").value.trim();
  if(!d) return alert("請選擇請假日期");
  if(!r) return alert("請填寫事由");
  if(DB.leaves.some(l=>l.studentId===session.id&&l.date===d&&l.status!=="退回")) return alert("該日期已有申請紀錄");
  DB.leaves.push({id:"L"+Date.now(),studentId:session.id,date:d,reason:r,status:"待審核",applyDate:new Date().toISOString().slice(0,10),reviewer:null,reviewNote:""});
  saveDB(); render(); alert("已送出，請等待導師審核");
}
function leaveCancel(id){
  if(!confirm("確定撤回此申請？")) return;
  DB.leaves=DB.leaves.filter(l=>l.id!==id); saveDB(); render();
}

/* ---------- 學生：獎懲與操行 ---------- */
function rewardPill(t){ const good=["嘉獎","小功","大功"].includes(t); return `<span class="pill ${good?"p-green":"p-red"}">${esc(t)}</span>`; }
function vConductStudent(){
  const {score,list}=conductOf(session.id);
  const cnt=t=>list.filter(r=>r.type===t).length;
  return `<div class="card"><h2>🏅 獎懲紀錄與操行成績</h2>
  <div class="sub">操行 = ${CONDUCT_BASE}(基點) ＋ 嘉獎×1 ＋ 小功×2.5 ＋ 大功×7.5 － 警告×1 － 小過×2.5 － 大過×7.5（0–100分）</div>
  <div class="kpi"><div class="k">操行成績 <b>${score}</b></div>
  <div class="k">嘉獎 <b>${cnt("嘉獎")}</b></div><div class="k">小功 <b>${cnt("小功")}</b></div><div class="k">大功 <b>${cnt("大功")}</b></div>
  <div class="k">警告 <b>${cnt("警告")}</b></div><div class="k">小過 <b>${cnt("小過")}</b></div><div class="k">大過 <b>${cnt("大過")}</b></div></div>
  <table><tr><th>日期</th><th>獎懲</th><th>事由</th><th>登錄人</th></tr>
  ${list.map(r=>`<tr><td>${esc(r.date)}</td><td>${rewardPill(r.type)}</td><td>${esc(r.reason)}</td><td>${esc(r.recorder||"")}</td></tr>`).join("")||"<tr><td colspan=4>尚無紀錄</td></tr>"}</table></div>`;
}

/* ---------- 老師/管理員：請假審核 ---------- */
function vLeaveReview(isAdmin){
  const list=(isAdmin?[...DB.leaves]:DB.leaves.filter(l=>{const s=userById(l.studentId);return s&&s.advisorId===session.id;}))
    .sort((a,b)=>((a.status==="待審核"?0:1)-(b.status==="待審核"?0:1))||b.date.localeCompare(a.date));
  const pend=list.filter(l=>l.status==="待審核").length;
  return `<div class="card"><h2>📝 ${isAdmin?"請假管理（全部）":"請假審核（導生成員）"}</h2>
  <div class="sub">待審核 ${pend} 件。通過後系統自動將該生當天所有課程記為「請假」。</div>
  <table><tr><th>日期</th><th>學生</th><th>事由</th><th>申請日</th><th>狀態</th><th>審核</th></tr>
  ${list.map(l=>{const s=userById(l.studentId);return `<tr><td>${esc(l.date)}</td><td>${esc(s?.name||"?")}(${esc(s?.account||"")})</td>
    <td>${esc(l.reason)}</td><td>${esc(l.applyDate||"")}</td><td>${leavePill(l.status)}${l.reviewer?`<br><span style="font-size:12px;color:#64748b">${esc(l.reviewer)}: ${esc(l.reviewNote||"")}</span>`:""}</td>
    <td>${l.status==="待審核"?`<button class="btn btn-sm btn-ok" onclick="reviewLeave('${l.id}',true)">通過</button> <button class="btn btn-sm btn-danger" onclick="reviewLeave('${l.id}',false)">退回</button>`:"—"}</td></tr>`}).join("")||"<tr><td colspan=6>無申請紀錄</td></tr>"}</table></div>`;
}
function reviewLeave(id,ok){
  const l=DB.leaves.find(x=>x.id===id); if(!l||l.status!=="待審核") return;
  let note;
  if(ok){ note=prompt("審核意見（選填）：","准假"); if(note==null) return; }
  else { note=prompt("退回原因（將顯示給學生）：",""); if(note==null) return; }
  l.status=ok?"通過":"退回"; l.reviewer=session.name; l.reviewNote=note||"";
  if(ok) autoLeaveAtt(l.studentId,l.date);
  saveDB(); render(); alert(ok?"已通過，當天課程已自動記為請假":"已退回");
}
function autoLeaveAtt(sid,date){
  const cur=new Set(DB.courses.filter(c=>c.semester===CURR_SEM).map(c=>c.id)); // 僅本學期課程
  myEnrollments(sid).filter(e=>cur.has(e.courseId)).forEach(e=>{
    if(!DB.attendance.some(a=>a.studentId===sid&&a.courseId===e.courseId&&a.date===date))
      DB.attendance.push({id:"A"+Date.now()+e.courseId,studentId:sid,courseId:e.courseId,date,status:"請假",note:"請假申請通過"});
  });
}

/* ---------- 老師/管理員：獎懲管理 ---------- */
function vRewardManage(isAdmin){
  let cands;
  if(isAdmin) cands=DB.users.filter(u=>u.role==="student");
  else{
    const ids=new Set(myAdvisees(session.id).map(s=>s.id));
    DB.courses.filter(c=>c.teacherId===session.id).forEach(c=>DB.enrollments.filter(e=>e.courseId===c.id).forEach(e=>ids.add(e.studentId)));
    cands=[...ids].map(userById).filter(Boolean);
  }
  const list=(isAdmin?[...DB.rewards]:DB.rewards.filter(r=>cands.some(s=>s.id===r.studentId)))
    .sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card"><h2>🏅 ${isAdmin?"獎懲管理（全部學生）":"獎懲管理（導生＋授課學生）"}</h2>
  <div class="sub">登錄後即時影響操行成績：基點${CONDUCT_BASE}，嘉獎+1 / 小功+2.5 / 大功+7.5 / 警告−1 / 小過−2.5 / 大過−7.5</div>
  <div class="grid2"><div>
    <h4 style="margin:0 0 4px">＋ 新增獎懲</h4>
    <label>學生</label><select id="rw_s">${cands.map(s=>`<option value="${s.id}">${esc(s.name)}(${esc(s.account)})・操行${conductOf(s.id).score}</option>`).join("")||"<option value=''>無</option>"}</select>
    <label>類別</label><select id="rw_t">${REWARD_TYPES.map(t=>`<option>${t}</option>`).join("")}</select>
    <label>日期</label><input type="date" id="rw_d" value="${new Date().toISOString().slice(0,10)}">
    <label>事由</label><input id="rw_r" placeholder="例如：校內服務表現優良">
    <button class="btn btn-p btn-sm" style="width:auto;margin-top:8px" onclick="rewardAdd()">登錄</button></div>
    <div><h4 style="margin:0 0 4px">紀錄（${list.length}）</h4>
    <table><tr><th>日期</th><th>學生</th><th>獎懲</th><th>事由</th><th>操作</th></tr>
    ${list.slice(0,60).map(r=>{const s=userById(r.studentId);return `<tr><td>${esc(r.date)}</td><td>${esc(s?.name||"?")}</td>
      <td>${rewardPill(r.type)}</td><td>${esc(r.reason)}<br><span style="font-size:12px;color:#64748b">${esc(r.recorder||"")}</span></td>
      <td><button class="btn btn-sm btn-danger" onclick="rewardDel('${r.id}')">刪除</button></td></tr>`}).join("")||"<tr><td colspan=5>無</td></tr>"}</table></div></div></div>`;
}
function rewardAdd(){
  const sid=$("rw_s").value, type=$("rw_t").value, d=$("rw_d").value||new Date().toISOString().slice(0,10), r=$("rw_r").value.trim();
  if(!sid) return alert("無可登錄學生");
  if(!r) return alert("請填寫事由");
  DB.rewards.push({id:"R"+Date.now(),studentId:sid,type,date:d,reason:r,recorder:session.name});
  saveDB(); render(); alert(`已登錄${type}，該生操行現為 ${conductOf(sid).score}`);
}
function rewardDel(id){ if(!confirm("確定刪除此筆獎懲？操行將重新計算。")) return; DB.rewards=DB.rewards.filter(r=>r.id!==id); saveDB(); render(); }

/* ---------- 老師：查看學生完整資料 ---------- */
function viewStudent(sid){
  const s=userById(sid); if(!s) return;
  const adv=s.advisorId?userById(s.advisorId):null;
  const {score,list}=conductOf(sid);
  const att=DB.attendance.filter(a=>a.studentId===sid);
  const lv=DB.leaves.filter(l=>l.studentId===sid).sort((a,b)=>b.date.localeCompare(a.date));
  const cst=st=>att.filter(a=>a.status===st).length;
  openModal(`<h3>👤 ${esc(s.name)}（${esc(s.account)}）</h3>
  <table><tr><th>系級</th><td>${esc(s.dept)}</td></tr>
  <tr><th>導師</th><td>${adv?esc(adv.name):"未指派"}</td></tr>
  <tr><th>Email</th><td>${esc(s.email||"—")}</td></tr><tr><th>電話</th><td>${esc(s.phone||"—")}</td></tr>
  <tr><th>生日</th><td>${esc(s.birthday||"—")}</td></tr><tr><th>地址</th><td>${esc(s.address||"—")}</td></tr>
  <tr><th>操行</th><td><b>${score}</b>（獎懲 ${list.length} 筆）</td></tr>
  <tr><th>出缺席</th><td>出席${cst("出席")} 遲到${cst("遲到")} 缺席${cst("缺席")} 請假${cst("請假")}</td></tr></table>
  <h4>獎懲紀錄</h4><table><tr><th>日期</th><th>獎懲</th><th>事由</th></tr>
  ${list.map(r=>`<tr><td>${esc(r.date)}</td><td>${rewardPill(r.type)}</td><td>${esc(r.reason)}</td></tr>`).join("")||"<tr><td colspan=3>無</td></tr>"}</table>
  <h4>請假紀錄</h4><table><tr><th>日期</th><th>事由</th><th>狀態</th></tr>
  ${lv.map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.reason)}</td><td>${leavePill(l.status)}</td></tr>`).join("")||"<tr><td colspan=3>無</td></tr>"}</table><br>
  <button class="btn" onclick="closeModal()">關閉</button>`);
}

/* ================= 啟動 ================= */
loadDB().then(()=>{ renderDemo(); });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&$("loginPage").style.display!=="none") doLogin(); });
</script>
