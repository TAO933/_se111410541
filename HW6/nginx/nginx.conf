# 上游服務（compose 內的 service name 即 DNS 名稱）
upstream frontend_up { server frontend:80; }
upstream node_up     { server api-node:3001; }
upstream python_up   { server api-python:5000; }
upstream rust_up     { server api-rust:8000; }

server {
    listen 80;
    server_name localhost;

    # 前端首頁
    location / {
        proxy_pass http://frontend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Node.js 微服務：/api/node/xxx -> api-node:/xxx
    location /api/node/ {
        rewrite ^/api/node/(.*)$ /$1 break;
        proxy_pass http://node_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 讓 /api/node 不加斜線也能通
    location = /api/node {
        return 301 /api/node/;
    }

    # Python 微服務
    location /api/python/ {
        rewrite ^/api/python/(.*)$ /$1 break;
        proxy_pass http://python_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/python {
        return 301 /api/python/;
    }

    # Rust 微服務
    location /api/rust/ {
        rewrite ^/api/rust/(.*)$ /$1 break;
        proxy_pass http://rust_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/rust {
        return 301 /api/rust/;
    }

    # 健康檢查
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
